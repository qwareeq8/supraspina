[project]
name = "supraspina-sidecar"
version = "20261122.2152.0"
description = "Python orchestration sidecar for the Supraspina research desktop console."
authors = [
  { name = "Yusuf Qwareeq", email = "yusuf@qwareeq.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  # The group-analysis engine fits OLS and runs Freedman-Lane permutations with
  # NumPy; the exact pin keeps its PCG64 permutation stream reproducible.
  "numpy==2.5.3",
  # Keep openpyxl in the frozen runtime closure, not only in test tooling, because
  # ClinicalAdapter.detect() validates the analysis workbook in every shipped
  # application.
  "openpyxl==3.1.5",
  "pydantic==2.13.4",
]

[project.urls]
Homepage = "https://qwareeq.com/"
Repository = "https://github.com/qwareeq8/supraspina"
Issues = "https://github.com/qwareeq8/supraspina/issues"

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.15",
]
# Build the frozen, distributable sidecar binary on each release target.
freeze = ["pyinstaller==6.21.0"]

[project.scripts]
supraspina-sidecar = "supraspina_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supraspina_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
